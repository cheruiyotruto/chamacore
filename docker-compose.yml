name: chama-core

x-app: &app
  build:
    context: .
    target: runtime
  image: chama-core:latest
  restart: unless-stopped
  env_file:
    - .env
  volumes:
    - storage:/var/www/html/storage
  depends_on:
    mysql:
      condition: service_healthy
    redis:
      condition: service_started
  networks:
    - chama

x-environment: &environment
  DB_HOST: mysql
  DB_PORT: "3306"
  DB_DATABASE: ${DB_DATABASE:-chama_core}
  DB_USERNAME: ${CHAMA_DB_USER:-chama}
  DB_PASSWORD: ${CHAMA_DB_PASSWORD:-secret}
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  CACHE_STORE: redis
  QUEUE_CONNECTION: redis
  SESSION_DRIVER: redis
  TRUSTED_PROXIES: ${TRUSTED_PROXIES:-*}

services:
  app:
    <<: *app
    environment:
      <<: *environment
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-false}
      RUN_OPTIMIZE: ${RUN_OPTIMIZE:-false}

  queue:
    <<: *app
    command: ["php", "artisan", "queue:work", "--tries=3", "--timeout=120", "--sleep=3", "--max-time=3600"]
    environment: *environment
    stop_grace_period: 30s

  scheduler:
    <<: *app
    command: ["php", "artisan", "schedule:work", "--verbose"]
    environment: *environment

  nginx:
    build:
      context: .
      target: web
    image: chama-core-web:latest
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - storage:/var/www/html/storage:ro
    depends_on:
      - app
    networks:
      - chama
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/up >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-chama_core}
      MYSQL_USER: ${CHAMA_DB_USER:-chama}
      MYSQL_PASSWORD: ${CHAMA_DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root-secret}
      TZ: Africa/Nairobi
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - chama
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    networks:
      - chama
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  mysql-data:
  redis-data:
  storage:

networks:
  chama:
    driver: bridge
